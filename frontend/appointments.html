<!DOCTYPE html>

<html>

<head>

<title>Appointments</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>Appointment Booking</h1>

<p>Register Patient And Book Doctor Appointment</p>

</header>




<nav>

<a href="index.html">Home</a>

<a href="doctors.html">Doctors</a>

<a href="patients.html">Patients</a>

<a href="appointments.html">Appointments</a>

</nav>





<section class="form-box">


<h2>Patient Details</h2>



<input id="name" type="text" placeholder="Patient Name">



<input id="age" type="number" placeholder="Age">



<select id="gender">

<option value="">Select Gender</option>

<option value="Male">Male</option>

<option value="Female">Female</option>

<option value="Other">Other</option>

</select>




<input id="city" type="text" placeholder="City / Village">



<input id="contact" type="text" placeholder="Contact Number">



<input id="disease" type="text" placeholder="Disease / Health Problem">





<h2>Doctor Appointment</h2>




<select id="doctor">

<option value="">Select Doctor</option>

<option>
Dr. Ravi Kumar - General Physician
</option>

<option>
Dr. Anitha - Cardiologist
</option>

<option>
Dr. Suresh - Orthopedic Specialist
</option>

<option>
Dr. Priya - Pediatrician
</option>


</select>





<input id="date" type="date">





<textarea id="reason" placeholder="Reason for Visit"></textarea>





<button onclick="bookAppointment()">

Book Appointment

</button>




</section>



<script src="script.js"></script>


</body>


</html>
